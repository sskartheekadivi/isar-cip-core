DISTRO_ARCH = "amd64"

IMAGE_FSTYPES ?= "ext4"
USE_CIP_KERNEL_CONFIG = "1"

PREFERRED_PROVIDER_factory-reset-helper:swupdate = "factory-reset-helper-efi"

# when running without kvm (as in CI so far), 60 seconds might be to short
WDOG_TIMEOUT = "120"
