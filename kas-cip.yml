header:
  version: 14

distro: cip-core-bookworm
target: cip-core-image

build_system: isar

repos:
  cip-core:

  isar:
    url: https://github.com/ilbers/isar.git
    commit: d63a1cbae6f737aa843d00d8812547fe7b87104a
    patches:
      p1:
        repo: cip-core
        path: isar-patches/0001-initramfs-tee-ftpm-hook-Add-support-for-cutting-depe.patch
      p2:
        repo: cip-core
        path: isar-patches/0002-optee-ftpm-Add-support-for-new-optee_ftpm-repo.patch
    layers:
      meta:

bblayers_conf_header:
  standard: |
    LCONF_VERSION = "6"

local_conf_header:
  standard: |
    CONF_VERSION = "1"
  cross: |
    ISAR_CROSS_COMPILE = "1"
  ccache: |
    USE_CCACHE = "1"
  root_password: |
    USERS += "root"
    USER_root[password] = "root"
    USER_root[flags] = "clear-text-password"
  source_epoch: |
    SOURCE_DATE_EPOCH_FALLBACK := "${@bb.process.run("git -C ${LAYERDIR_cip-core} log -1 --pretty=%ct | tr -d '\n'")[0]}"

env:
  DISTRO_APT_PREMIRRORS: ""
