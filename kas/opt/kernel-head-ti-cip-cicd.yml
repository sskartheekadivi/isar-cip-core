# Build the head of the TI CIP kernel branch that is not yet promoted
# (ti-linux-6.12.y-cip-cicd). This includes everything needed to select the
# head of the TI CIP kernel.
#

header:
  version: 14
  includes:
    - kas/opt/kernel-source-ti-cip.yml
    - kas/opt/kernel-head-ti-cip.yml

local_conf_header:
  kernel-head-ti-cip-cicd: |
    TI_CIP_BRANCH = "ti-linux-6.12.y-cip-cicd"
