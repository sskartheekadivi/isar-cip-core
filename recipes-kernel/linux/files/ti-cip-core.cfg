# Options required by CIP Core features that the defconfig of the TI CIP
# kernel does not enable. They match what cip_merged_defconfig of
# cip-kernel-config provides.

# Firmware TPM and rewritable UEFI variable storage via OP-TEE
CONFIG_RPMB=y
CONFIG_TCG_FTPM_TEE=y
CONFIG_TEE_STMM_EFI=y

# Disk encryption and integrity protection
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y

# Root file system and update images
CONFIG_EROFS_FS=y
CONFIG_SQUASHFS_XZ=y
